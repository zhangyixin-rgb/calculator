# =====================================================================
# web/nginx.conf —— 前端容器内的 nginx 配置（Lab 7）
#
# 关键点：浏览器运行在宿主机上，无法解析 Docker 内部域名 backend，
# 所以前端 JS 只请求同源的相对路径 /api/...，由这里的 nginx 转发到
# compose 网络中的后端服务 http://backend:8000。
# =====================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 计算 API：路径原样转发给 compose 内部的服务名 backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 静态页面：找不到文件时回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
